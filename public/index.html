<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Contacts Search Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 15px;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 20px; color: #38bdf8; margin-bottom: 20px; text-align: center; }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 12px 24px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0369a1; }
        #results {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .card {
            background: #1e293b;
            border-left: 4px solid #38bdf8;
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
        }
        .card span { color: #94a3b8; }
        .badge {
            background: #0f172a;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #38bdf8;
            float: right;
        }
        .loading { text-align: center; color: #94a3b8; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 কন্টাক্ট ডেটাবেস সার্চ</h1>
    <div class="search-box">
        <input type="text" id="queryInput" placeholder="নাম, ফোন নম্বর (+972...) বা ইউজারনেম লিখুন...">
        <button onclick="performSearch()">সার্চ</button>
    </div>

    <div id="loading" class="loading" style="display: none;">অনুসন্ধান করা হচ্ছে...</div>
    <div id="results"></div>
</div>

<script>
    function performSearch() {
        const query = document.getElementById('queryInput').value.trim();
        const resultsContainer = document.getElementById('results');
        const loader = document.getElementById('loading');

        if (!query) {
            alert("অনুগ্রহ করে কোনো তথ্য লিখুন!");
            return;
        }

        resultsContainer.innerHTML = '';
        loader.style.display = 'block';

        fetch(`/api/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                loader.style.display = 'none';
                if (data.status === "success") {
                    if (data.total_found === 0) {
                        resultsContainer.innerHTML = '<p style="text-align:center; color:#ef4444;">কোনো ফলাফল পাওয়া যায়নি!</p>';
                        return;
                    }
                    data.results.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            ${item.platform ? `<span class="badge">${item.platform}</span>` : ''}
                            <strong>👤 নাম:</strong> ${item.full_name || 'N/A'}<br>
                            <strong>📞 ফোন:</strong> ${item.phone || 'N/A'}<br>
                            <strong>🆔 ইউজারনেম:</strong> ${item.username || 'N/A'}<br>
                            <strong>✉️ ইমেইল:</strong> ${item.email || 'N/A'}<br>
                            ${item.city ? `<strong>📍 শহর:</strong> ${item.city}` : ''}
                        `;
                        resultsContainer.appendChild(card);
                    });
                } else {
                    resultsContainer.innerHTML = `<p style="text-align:center; color:#ef4444;">এরর: ${data.message || 'কিছু একটা ভুল হয়েছে'}</p>`;
                }
            })
            .catch(err => {
                loader.style.display = 'none';
                resultsContainer.innerHTML = '<p style="text-align:center; color:#ef4444;">সার্ভারের সাথে সংযোগ বিচ্ছিন্ন হয়েছে।</p>';
            });
    }

    document.getElementById('queryInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });
</script>

</body>
</html>
