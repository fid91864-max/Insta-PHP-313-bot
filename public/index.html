<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIN & Luhn Card Validator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #090d16;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 30px;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        h2 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 100px;
            background: #030712;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 15px;
            resize: none;
            outline: none;
        }
        button {
            width: 100%;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0369a1; }
        .result-box {
            display: none;
            margin-top: 20px;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px;
        }
        .item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #111827; font-size: 14px; }
        .item:last-child { border-bottom: none; }
        .label { color: #94a3b8; }
        .val { color: #f8fafc; font-weight: 600; }
        .badge-success { color: #34d399; font-weight: bold; }
        .badge-error { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Card Format & BIN Inspector</h2>
    <p>ফরম্যাট যাচাই এবং ইস্যুকারী ব্যাংক/দেশ চেক করতে ইনপুট দিন:</p>

    <textarea id="cardInput" placeholder="4532012345678910|12|28|123"></textarea>
    <button id="checkBtn" onclick="runCheck()">যাচাই করুন</button>

    <div id="resultBox" class="result-box">
        <div class="item"><span class="label">Status:</span><span id="resStatus" class="val">-</span></div>
        <div class="item"><span class="label">Masked Card:</span><span id="resCard" class="val">-</span></div>
        <div class="item"><span class="label">Scheme / Brand:</span><span id="resScheme" class="val">-</span></div>
        <div class="item"><span class="label">Card Type:</span><span id="resType" class="val">-</span></div>
        <div class="item"><span class="label">Bank / Issuer:</span><span id="resBank" class="val">-</span></div>
        <div class="item"><span class="label">Country:</span><span id="resCountry" class="val">-</span></div>
    </div>
</div>

<script>
async function runCheck() {
    const input = document.getElementById('cardInput').value.trim();
    const btn = document.getElementById('checkBtn');
    const resultBox = document.getElementById('resultBox');

    if (!input) return alert("কার্ড ইনপুট দিন!");

    btn.disabled = true;
    btn.textContent = "Checking...";
    resultBox.style.display = "none";

    try {
        const res = await fetch('/api/check.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ card: input })
        });
        const data = await res.json();

        resultBox.style.display = "block";
        if (data.status === 'success') {
            document.getElementById('resStatus').innerHTML = '<span class="badge-success">Valid (Luhn OK)</span>';
            document.getElementById('resCard').textContent = data.masked_card;
            document.getElementById('resScheme').textContent = data.bin_info.scheme + ' (' + data.bin_info.brand + ')';
            document.getElementById('resType').textContent = data.bin_info.type;
            document.getElementById('resBank').textContent = data.bin_info.issuer;
            document.getElementById('resCountry').textContent = data.bin_info.country;
        } else {
            document.getElementById('resStatus').innerHTML = '<span class="badge-error">' + (data.message || 'Invalid') + '</span>';
            document.getElementById('resCard').textContent = data.card_number || '-';
            document.getElementById('resScheme').textContent = '-';
            document.getElementById('resType').textContent = '-';
            document.getElementById('resBank').textContent = '-';
            document.getElementById('resCountry').textContent = '-';
        }
    } catch (e) {
        alert("সার্ভার রিকোয়েস্ট ব্যর্থ হয়েছে!");
    } finally {
        btn.disabled = false;
        btn.textContent = "যাচাই করুন";
    }
}
</script>

</body>
</html>
