<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud API Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 10px #10b981;
        }
        h1 { font-size: 22px; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
        code {
            display: block;
            margin-top: 20px;
            background: #030712;
            padding: 10px;
            border-radius: 8px;
            color: #38bdf8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1><span class="status-dot"></span> API Gateway Online</h1>
        <p>Endpoint is active and receiving requests. Use your authenticated API key to query data.</p>
        <code>GET /api/search.php?phone=...&key=YOUR_KEY</code>
    </div>
</body>
</html>
