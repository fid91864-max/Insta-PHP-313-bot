<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMEI ডিভাইস চেকার</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0369a1; }
        .result-box {
            display: none;
            background: #0f172a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #334155;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 14px;
        }
        .result-item:last-child { border-bottom: none; }
        .label { color: #94a3b8; }
        .val { color: #f1f5f9; font-weight: 500; text-align: right; }
        .error { color: #ef4444; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>ডিভাইস স্পেসিফিকেশন চেকার</h2>
    
    <div class="input-group">
        <input type="text" id="imeiInput" placeholder="১৫ ডিজিটের IMEI নাম্বার দিন..." maxlength="15">
        <button id="searchBtn">যাচাই করুন</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <div id="resultBox" class="result-box">
        <div class="result-item"><span class="label">Brand:</span><span class="val" id="resBrand">-</span></div>
        <div class="result-item"><span class="label">Model:</span><span class="val" id="resModel">-</span></div>
        <div class="result-item"><span class="label">Release:</span><span class="val" id="resDate">-</span></div>
        <div class="result-item"><span class="label">OS:</span><span class="val" id="resOS">-</span></div>
        <div class="result-item"><span class="label">Chipset:</span><span class="val" id="resChip">-</span></div>
        <div class="result-item"><span class="label">RAM & Storage:</span><span class="val" id="resMem">-</span></div>
        <div class="result-item"><span class="label">Display:</span><span class="val" id="resDisplay">-</span></div>
        <div class="result-item"><span class="label">Camera:</span><span class="val" id="resCam">-</span></div>
        <div class="result-item"><span class="label">Battery:</span><span class="val" id="resBat">-</span></div>
    </div>
</div>

<script>
    document.getElementById('searchBtn').addEventListener('click', async () => {
        const imei = document.getElementById('imeiInput').value.trim();
        const errEl = document.getElementById('errorMsg');
        const resBox = document.getElementById('resultBox');

        errEl.textContent = "";
        resBox.style.display = "none";

        if (imei.length !== 15 || isNaN(imei)) {
            errEl.textContent = "অনুগ্রহ করে সঠিক ১৫ ডিজিটের সংখ্যা লিখুন।";
            return;
        }

        try {
            const response = await fetch('/api/check.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imei: imei })
            });

            const result = await response.json();

            if (result.status === 'success') {
                const d = result.data;
                document.getElementById('resBrand').textContent = d.brand;
                document.getElementById('resModel').textContent = d.model + ` (${d.code_name})`;
                document.getElementById('resDate').textContent = d.release_date;
                document.getElementById('resOS').textContent = d.operating_systems;
                document.getElementById('resChip').textContent = d.chipset;
                document.getElementById('resMem').textContent = `${d.ram} / ${d.storage}`;
                document.getElementById('resDisplay').textContent = d.display;
                document.getElementById('resCam').textContent = d.camera;
                document.getElementById('resBat').textContent = d.battery;

                resBox.style.display = "block";
            } else {
                errEl.textContent = result.message || "কোনো তথ্য পাওয়া যায়নি।";
            }
        } catch (e) {
            errEl.textContent = "সার্ভারের সাথে সংযোগ স্থাপন করা যায়নি।";
        }
    });
</script>

</body>
</html>
