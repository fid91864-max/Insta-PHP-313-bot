<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Manager Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: #f8fafc; padding: 20px; }
        .box { max-width: 900px; margin: 0 auto; background: #131c31; border: 1px solid #1e293b; padding: 30px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        .login-box { max-width: 400px; margin: 100px auto; background: #131c31; border: 1px solid #1e293b; padding: 30px; border-radius: 14px; text-align: center; }
        input, button { padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; font-size: 15px; }
        input { background: #0b0f19; color: #fff; outline: none; }
        button { background: #0284c7; color: #fff; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .form-row { display: flex; gap: 10px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { background: #0b0f19; color: #94a3b8; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #065f46; color: #34d399; }
        .badge-limit { background: #991b1b; color: #f87171; }
        .btn-del { background: #ef4444; padding: 6px 12px; font-size: 13px; }
        .btn-del:hover { background: #dc2626; }
        code { background: #0b0f19; padding: 4px 8px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
    </style>
</head>
<body>

<div id="loginSection" class="login-box">
    <h2>অ্যাডমিন লগইন</h2>
    <input type="password" id="adminPass" placeholder="পাসওয়ার্ড দিন (9876543210)..." style="width: 100%; margin-bottom: 15px;">
    <button onclick="login()" style="width: 100%;">লগইন করুন</button>
</div>

<div id="dashboardSection" class="box" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <h2>API Key & Limit Manager</h2>
        <button onclick="logout()" style="background: #334155;">লগআউট</button>
    </div>

    <div class="form-row">
        <input type="text" id="keyPrefix" placeholder="Prefix (যেমন: USER)" value="VIP">
        <input type="number" id="keyLimit" placeholder="রিকোয়েস্ট লিমিট (যেমন: 100)" value="100">
        <button onclick="createKey()">+ নতুন Key তৈরি করুন</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>API Key</th>
                <th>ব্যবহার / লিমিট</th>
                <th>স্ট্যাটাস</th>
                <th>অ্যাকশন</th>
            </tr>
        </thead>
        <tbody id="keysTable"></tbody>
    </table>
</div>

<script>
    let token = localStorage.getItem('admin_token') || '';

    if (token) checkAuth();

    function login() {
        token = document.getElementById('adminPass').value.trim();
        localStorage.setItem('admin_token', token);
        checkAuth();
    }

    function logout() {
        localStorage.removeItem('admin_token');
        location.reload();
    }

    async function checkAuth() {
        try {
            const res = await fetch('/api/manage.php', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.status === 200) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadKeys();
            } else {
                alert("ভুল পাসওয়ার্ড!");
                logout();
            }
        } catch (e) {
            alert("সার্ভার এরর!");
        }
    }

    async function loadKeys() {
        const res = await fetch('/api/manage.php', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        const tbody = document.getElementById('keysTable');
        tbody.innerHTML = '';

        data.forEach(item => {
            const isExhausted = item.req_used >= item.req_limit;
            tbody.innerHTML += `
                <tr>
                    <td><code>${item.api_key}</code></td>
                    <td><b>${item.req_used}</b> / ${item.req_limit}</td>
                    <td>
                        <span class="badge ${isExhausted ? 'badge-limit' : 'badge-active'}">
                            ${isExhausted ? 'Exhausted' : 'Active'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-del" onclick="deleteKey(${item.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    async function createKey() {
        const prefix = document.getElementById('keyPrefix').value;
        const limit = document.getElementById('keyLimit').value;
        await fetch('/api/manage.php', {
            method: 'POST',
            headers: { 
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ prefix, limit })
        });
        loadKeys();
    }

    async function deleteKey(id) {
        if (!confirm("আপনি কি নিশ্চিত এই Key মুছে ফেলতে চান?")) return;
        await fetch('/api/manage.php?id=' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        loadKeys();
    }
</script>

</body>
</html>
