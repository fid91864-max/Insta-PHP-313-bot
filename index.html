<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030712">
<title>TikTok Likes Booster 313</title>
<!-- Cloudflare Turnstile API -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root {
  --bg: #030712;
  --card: rgba(15, 23, 42, 0.85);
  --border: rgba(0, 242, 254, 0.2);
  --cyan: #00f2fe;
  --pink: #ff007f;
  --purple: #7928ca;
  --green: #10b981;
  --text: #f8fafc;
  --muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  background: 
    radial-gradient(circle at 10% 10%, rgba(121, 40, 202, 0.25), transparent 45%),
    radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.2), transparent 45%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding: 16px 14px 40px;
}

.shell {
  max-width: 460px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 12px 16px;
  margin-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--cyan), var(--pink));
  display: grid;
  place-items: center;
  font-size: 18px;
  box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
}

.brand-text h2 {
  font-size: 14px;
  font-weight: 900;
}

.brand-text span {
  font-size: 9px;
  color: var(--cyan);
  font-weight: 700;
  letter-spacing: 1.5px;
}

.tg-btn {
  background: rgba(0, 242, 254, 0.1);
  border: 1px solid var(--border);
  color: var(--cyan);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}

.hero {
  text-align: center;
  margin-bottom: 22px;
}

.badge {
  display: inline-block;
  padding: 5px 12px;
  background: rgba(0, 242, 254, 0.1);
  border: 1px solid var(--border);
  color: var(--cyan);
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

h1 {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.5px;
}

.gradient {
  background: linear-gradient(90deg, #fff, var(--cyan), var(--pink));
  -webkit-background-clip: text;
  color: transparent;
}

/* Card */
.main-card {
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
  margin-bottom: 20px;
}

.field {
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
}

input[type="text"] {
  width: 100%;
  background: rgba(6, 10, 20, 0.85);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 14px;
  padding: 14px;
  font-size: 13px;
  outline: none;
  transition: 0.2s;
}

input[type="text"]:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
}

.btn-submit {
  width: 100%;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: #030712;
  border: 0;
  font-size: 14px;
  font-weight: 900;
  padding: 15px;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
  transition: all 0.2s;
}

.btn-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Timer HUD (Screenshot Style) */
.timer-card {
  display: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 25px 20px;
  text-align: center;
  margin-bottom: 20px;
}

.timer-circle {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 2px dashed var(--cyan);
  display: grid;
  place-items: center;
  margin: 0 auto 15px;
  font-size: 24px;
  font-weight: 900;
  font-family: ui-monospace, Consolas, monospace;
  color: var(--cyan);
  box-shadow: 0 0 20px rgba(0, 242, 254, 0.2) inset;
}

.timer-progress {
  width: 100%;
  height: 12px;
  background: rgba(6, 10, 20, 0.9);
  border-radius: 12px;
  overflow: hidden;
  margin-top: 15px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.timer-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  border-radius: 12px;
  transition: width 1s linear;
}

/* Turnstile Box */
.captcha-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 15px;
}

footer {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}

footer a {
  color: var(--cyan);
  text-decoration: none;
  font-weight: 800;
}
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h2>TIKTOK BOOSTER</h2>
        <span>ZEFAME CORE ENGINE</span>
      </div>
    </div>
    <a href="https://t.me/abdullah_al_hasib_313" target="_blank" class="tg-btn">Telegram</a>
  </header>

  <div class="hero">
    <div class="badge">10 FREE LIKES · 30 MIN</div>
    <h1>Boost Video. <span class="gradient">Instant Delivery.</span></h1>
  </div>

  <div class="main-card" id="formCard">
    <div class="field">
      <label>TIKTOK VIDEO URL</label>
      <input type="text" id="linkInput" placeholder="https://vt.tiktok.com/ZSgLGTuCJ/">
    </div>

    <div class="captcha-wrap">
      <!-- Zefame Cloudflare Turnstile Key -->
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAABcK-wG5qC4Gz8q" data-callback="onCaptchaSuccess"></div>
    </div>

    <button class="btn-submit" id="submitBtn">▶ SUBMIT ORDER</button>
  </div>

  <!-- Live Countdown Timer UI -->
  <div class="timer-card" id="timerCard">
    <h3 style="font-size:15px; margin-bottom:4px;">Order In Progress</h3>
    <p style="font-size:11px; color:var(--muted); margin-bottom:15px;">Please wait for the countdown to complete</p>
    
    <div class="timer-circle" id="timeDisplay">00:60</div>

    <div class="timer-progress">
      <div class="timer-bar" id="timerBar"></div>
    </div>
  </div>

  <footer>
    Crafted by <a href="https://t.me/abdullah_al_hasib_313" target="_blank">@abdullah_al_hasib_313</a>
  </footer>
</div>

<script>
let captchaToken = "";
let deviceUuid = crypto.randomUUID();

function onCaptchaSuccess(token) {
  captchaToken = token;
}

const linkInput = document.getElementById('linkInput');
const submitBtn = document.getElementById('submitBtn');
const formCard = document.getElementById('formCard');
const timerCard = document.getElementById('timerCard');
const timeDisplay = document.getElementById('timeDisplay');
const timerBar = document.getElementById('timerBar');

submitBtn.addEventListener('click', async () => {
  const link = linkInput.value.trim();
  if (!link) {
    alert("ভিডিও লিঙ্ক প্রবেশ করান!");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "VERIFYING LINK...";

  try {
    // ধাপ ১: Video ID সংগ্রহ
    const checkForm = new FormData();
    checkForm.append('action', 'checkVideoId');
    checkForm.append('link', link);

    const checkRes = await fetch('/api/order', { method: 'POST', body: checkForm });
    const checkData = await checkRes.json();

    if (!checkData.success || !checkData.data.videoId) {
      alert("ভিডিও আইডি খুঁজে পাওয়া যায়নি!");
      submitBtn.disabled = false;
      submitBtn.textContent = "▶ SUBMIT ORDER";
      return;
    }

    const videoId = checkData.data.videoId;

    // ধাপ ২: অর্ডার সাবমিট করা
    submitBtn.textContent = "PROCESSING ORDER...";

    const orderForm = new FormData();
    orderForm.append('action', 'order');
    orderForm.append('link', link);
    orderForm.append('videoId', videoId);
    orderForm.append('service', '232'); // 10 Free Likes
    orderForm.append('uuid', deviceUuid);
    orderForm.append('cf_token', captchaToken);

    const orderRes = await fetch('/api/order', { method: 'POST', body: orderForm });
    const orderData = await orderRes.json();

    if (orderData.success) {
      formCard.style.display = 'none';
      timerCard.style.display = 'block';
      startTimer(60); // স্ক্রিনশটের মতো ৬০ সেকেন্ড কাউন্টডাউন
    } else {
      alert(orderData.message || "অর্ডার সম্পন্ন করা যায়নি!");
      submitBtn.disabled = false;
      submitBtn.textContent = "▶ SUBMIT ORDER";
    }

  } catch (err) {
    alert("রিকোয়েস্টে সমস্যা হয়েছে: " + err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = "▶ SUBMIT ORDER";
  }
});

function startTimer(duration) {
  let timer = duration;
  const total = duration;

  const interval = setInterval(() => {
    let seconds = parseInt(timer % 60, 10);
    seconds = seconds < 10 ? "0" + seconds : seconds;
    timeDisplay.textContent = "00:" + seconds;

    const progressPct = ((total - timer) / total) * 100;
    timerBar.style.width = progressPct + "%";

    if (--timer < 0) {
      clearInterval(interval);
      timeDisplay.textContent = "DONE";
      timerBar.style.width = "100%";
      setTimeout(() => {
        alert("অর্ডার সফলভাবে পৌঁছে গেছে!");
        location.reload();
      }, 1000);
    }
  }, 1000);
}
</script>
</body>
</html>
