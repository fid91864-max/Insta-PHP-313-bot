<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSTA INFO 313 — Cyber Intelligence 2150</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f8fafc; overflow-x: hidden; }
        .glow-cyan { box-shadow: 0 0 25px rgba(0, 240, 255, 0.2); }
        .glass-panel { background: rgba(11, 15, 25, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .grid-bg { background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 32px 32px; }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(1000%); } }
        .scanner-beam { animation: scan 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="grid-bg min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">
    <header class="glass-panel sticky top-0 z-50 border-b border-white/10 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center glow-cyan">
                <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </div>
            <div>
                <h1 class="font-orbitron font-extrabold tracking-wider text-lg text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">INSTA INFO 313</h1>
                <p class="text-[10px] text-gray-400 font-mono tracking-widest uppercase">Cyber Intelligence System v2150</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="text-center mb-10">
            <span class="px-3 py-1 rounded-full text-xs font-mono bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 mb-4 inline-block">🚀 NEXT-GEN INSTAGRAM RECONNAISSANCE</span>
            <h2 class="font-orbitron text-3xl md:text-5xl font-black mb-4 tracking-tight">PUBLIC PROFILE INTELLIGENCE</h2>
        </div>

        <div class="glass-panel p-3 rounded-2xl glow-cyan max-w-2xl mx-auto mb-10">
            <form id="searchForm" class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-cyan-400 font-mono">@</span>
                    <input type="text" id="usernameInput" required placeholder="Enter Instagram username" class="w-full bg-black/50 border border-white/10 rounded-xl pl-9 pr-4 py-3.5 text-sm focus:outline-none focus:border-cyan-400 font-mono transition text-white">
                </div>
                <button type="submit" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-orbitron font-bold px-8 py-3.5 rounded-xl transition cursor-pointer">INITIALIZE SCAN</button>
            </form>
        </div>

        <div id="loadingState" class="hidden glass-panel p-12 rounded-2xl max-w-2xl mx-auto text-center relative overflow-hidden">
            <div class="absolute inset-x-0 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent scanner-beam"></div>
            <div class="w-16 h-16 rounded-full border-2 border-cyan-500/30 border-t-cyan-400 animate-spin mx-auto mb-4"></div>
            <h3 class="font-orbitron font-bold text-cyan-400 tracking-wider mb-2">SCANNING NEURAL DATABASE...</h3>
        </div>

        <div id="errorState" class="hidden glass-panel p-6 rounded-2xl max-w-2xl mx-auto border-red-500/30 bg-red-950/10 text-center mb-8">
            <p id="errorMessage" class="text-sm font-mono text-red-400"></p>
        </div>

        <div id="resultContainer" class="hidden glass-panel rounded-3xl p-6 md:p-8 max-w-2xl mx-auto border border-white/10 shadow-2xl">
            <div class="flex flex-col md:flex-row items-center gap-6 border-b border-white/10 pb-6 mb-6">
                <img id="resAvatar" src="" alt="Avatar" class="w-24 h-24 rounded-2xl object-cover border-2 border-cyan-400/50 glow-cyan">
                <div class="text-center md:text-left flex-grow">
                    <h3 id="resFullName" class="font-orbitron font-bold text-xl text-white"></h3>
                    <p id="resUsername" class="text-cyan-400 font-mono text-sm mb-2"></p>
                    <span id="resCategory" class="px-2.5 py-1 rounded-md text-xs font-mono bg-purple-500/20 text-purple-300 border border-purple-500/30"></span>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="bg-black/40 border border-white/5 rounded-2xl p-4 text-center">
                    <span id="resPosts" class="font-orbitron font-bold text-lg text-white block">0</span>
                    <span class="text-xs font-mono text-gray-400 uppercase">Posts</span>
                </div>
                <div class="bg-black/40 border border-white/5 rounded-2xl p-4 text-center">
                    <span id="resFollowers" class="font-orbitron font-bold text-lg text-cyan-400 block">0</span>
                    <span class="text-xs font-mono text-gray-400 uppercase">Followers</span>
                </div>
                <div class="bg-black/40 border border-white/5 rounded-2xl p-4 text-center">
                    <span id="resFollowing" class="font-orbitron font-bold text-lg text-purple-400 block">0</span>
                    <span class="text-xs font-mono text-gray-400 uppercase">Following</span>
                </div>
            </div>
            <div class="bg-black/40 border border-white/5 rounded-2xl p-4 mb-6">
                <p id="resBio" class="text-sm text-gray-300 whitespace-pre-line"></p>
            </div>
            <a id="resProfileLink" href="#" target="_blank" class="block w-full bg-cyan-500 hover:bg-cyan-400 text-black font-orbitron font-bold py-3 rounded-xl text-center text-sm transition">OPEN ON INSTAGRAM</a>
        </div>
    </main>

    <footer class="glass-panel border-t border-white/10 py-6 px-6 text-center mt-12">
        <p class="font-mono text-xs text-gray-400">Developed by <span class="text-cyan-400 font-bold">Abdullah Al Hasib 313</span> | Telegram: <a href="https://t.me/abdullah_al_hasib_313" class="text-purple-400">@abdullah_al_hasib_313</a></p>
    </footer>

    <script>
        const searchForm = document.getElementById('searchForm');
        const usernameInput = document.getElementById('usernameInput');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const resultContainer = document.getElementById('resultContainer');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim().replace(/^@/, '');
            if (!username) return;

            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            resultContainer.classList.add('hidden');

            try {
                const res = await fetch(`api/insta?username=${encodeURIComponent(username)}`);
                const data = await res.json();
                loadingState.classList.add('hidden');

                if (!res.ok || data.status !== 'success') {
                    throw new Error(data.message || 'ডাটা লোড করতে ব্যর্থ হয়েছে।');
                }

                const p = data.profile;
                document.getElementById('resAvatar').src = p.profile_pic_url || 'https://via.placeholder.com/150';
                document.getElementById('resFullName').textContent = p.full_name;
                document.getElementById('resUsername').textContent = '@' + p.username;
                document.getElementById('resCategory').textContent = p.category;
                document.getElementById('resPosts').textContent = p.posts_count;
                document.getElementById('resFollowers').textContent = p.followers_count;
                document.getElementById('resFollowing').textContent = p.following_count;
                document.getElementById('resBio').textContent = p.biography || 'No biography.';
                document.getElementById('resProfileLink').href = p.profile_url;
                
                resultContainer.classList.remove('hidden');
            } catch (err) {
                loadingState.classList.add('hidden');
                errorMessage.textContent = err.message;
                errorState.classList.remove('hidden');
            }
        });
    </script>
</body>
                </html>
